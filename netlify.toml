# ── Netlify configuration for XOHO ──────────────────────────────

[build]
  base    = "xoho"
  publish = "."

# ── Pretty URLs (remove .html extension) ───────────────────────

[[redirects]]
  from   = "/boutique"
  to     = "/boutique.html"
  status = 200

[[redirects]]
  from   = "/produit"
  to     = "/produit.html"
  status = 200

[[redirects]]
  from   = "/succes"
  to     = "/succes.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

# ── Security headers ────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
